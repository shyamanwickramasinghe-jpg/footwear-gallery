<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>DSI FOOTTECH — AI Auto Time Study</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #0b1120;
            color: #f8fafc;
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- TOP HEADER --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            border-bottom: 1px solid #1e293b;
            padding: 10px 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 100;
        }
        .brand { display: flex; align-items: center; gap: 15px; }
        .brand h2 { margin: 0; font-size: 1.2em; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; }
        .btn-back { background: #334155; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-back:hover { background: #475569; }

        /* --- SIMPLIFIED METADATA BAR --- */
        .meta-bar {
            display: flex;
            gap: 15px;
            padding: 12px 20px;
            background: #1e293b;
            border-bottom: 1px solid #334155;
            flex-wrap: wrap;
        }
        .input-group { display: flex; flex-direction: column; flex: 1; min-width: 150px; }
        .input-group label { font-size: 0.7em; text-transform: uppercase; color: #94a3b8; margin-bottom: 4px; font-weight: bold; }
        .input-group input, .input-group select { 
            background: #0f172a; border: 1px solid #475569; color: #fff; padding: 8px; border-radius: 6px; font-size: 0.9em; 
        }
        .input-group input:focus, .input-group select:focus { outline: none; border-color: #38bdf8; }
        
        .comments-group { flex: 2; min-width: 250px; }

        /* --- MAIN WORKSPACE --- */
        .workspace {
            display: flex;
            flex: 1;
            padding: 15px 20px;
            gap: 20px;
            overflow: hidden;
        }

        /* LEFT: VIDEO & AI ENGINE */
        .video-section {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .video-container {
            position: relative;
            flex: 1;
            background: #000;
            border-radius: 12px;
            border: 2px solid #334155;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        video { width: 100%; height: 100%; object-fit: cover; }
        
        /* AI Scanning Overlay Effects */
        .ai-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            border: 4px solid transparent; pointer-events: none; transition: border-color 0.3s;
        }
        .ai-overlay.active { border-color: #22c55e; }
        .ai-hud {
            position: absolute; top: 15px; left: 15px;
            background: rgba(0,0,0,0.7); border: 1px solid #22c55e; color: #22c55e;
            padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 0.85em;
            display: none; align-items: center; gap: 8px;
        }
        .ai-hud.recording { display: flex; animation: pulse 2s infinite; }
        .red-dot { width: 10px; height: 10px; background: #ef4444; border-radius: 50%; }
        
        .ai-element-popup {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(15,23,42,0.9); border: 1px solid #38bdf8; color: #fff;
            padding: 10px 20px; border-radius: 30px; font-size: 1.1em; font-weight: bold;
            display: none; text-align: center; box-shadow: 0 4px 15px rgba(56,189,248,0.3);
        }

        /* Control Buttons */
        .video-controls { display: flex; gap: 10px; }
        .btn-action { 
            flex: 1; padding: 15px; border-radius: 8px; font-size: 1.05em; font-weight: bold; border: none; cursor: pointer; transition: 0.2s;
        }
        .btn-start { background: #2563eb; color: white; }
        .btn-start:hover { background: #1d4ed8; }
        .btn-stop { background: #ef4444; color: white; display: none; }
        .btn-stop:hover { background: #b91c1c; }
        .btn-improve { background: #10b981; color: #000; display: none; box-shadow: 0 0 15px rgba(16,185,129,0.4); }
        .btn-improve:hover { background: #059669; color: #fff; }

        /* RIGHT: DATA & SMV RESULTS */
        .data-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 15px;
        }

        /* KPI Dashboard */
        .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .kpi-box { background: #1e293b; padding: 15px; border-radius: 8px; text-align: center; border-left: 4px solid #38bdf8; }
        .kpi-box h4 { margin: 0 0 5px 0; font-size: 0.75em; color: #94a3b8; text-transform: uppercase; }
        .kpi-box .val { font-size: 1.6em; font-weight: 900; color: #fff; }
        .kpi-box.highlight { border-left-color: #22c55e; background: rgba(34,197,94,0.1); }
        .kpi-box.highlight .val { color: #22c55e; }

        /* Auto-Elements Table */
        .table-container { flex: 1; overflow-y: auto; border: 1px solid #334155; border-radius: 8px; background: #000; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9em; }
        th { background: #1e293b; color: #94a3b8; padding: 10px; position: sticky; top: 0; }
        td { padding: 10px; border-bottom: 1px solid #1e293b; color: #cbd5e1; }
        tr.active-row { background: rgba(56,189,248,0.15); }
        
        /* Bottom Actions */
        .bottom-actions { display: flex; gap: 10px; }
        .bottom-actions button { flex: 1; padding: 10px; font-weight: bold; border-radius: 6px; cursor: pointer; border: none; }
        .btn-pdf { background: #f59e0b; color: #000; }
        .btn-audit { background: #8b5cf6; color: #fff; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        /* Official PDF hidden area */
        #printArea { display: none; }
        @media print {
            body { background: #fff !important; color: #000 !important; }
            .top-bar, .meta-bar, .workspace { display: none !important; }
            #printArea { display: block !important; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="top-bar">
        <div class="brand">
            <button class="btn-back" onclick="window.location.href='index.html'">⬅ Back</button>
            <h2>🤖 AI Vision Time Study</h2>
        </div>
        <div>
            <button class="btn-back" onclick="startCamera()" style="background:#0284c7;">📷 Open Camera</button>
        </div>
    </div>

    <!-- METADATA INPUTS -->
    <div class="meta-bar">
        <div class="input-group">
            <label>Product / Style</label>
            <input type="text" id="mProduct" value="Kelsey / PF0339" oninput="updateCalculations()">
        </div>
        <div class="input-group">
            <label>Operation Name</label>
            <input type="text" id="mOperation" value="Bow Velcro Attach" style="color:#38bdf8; font-weight:bold;" oninput="updateCalculations()">
        </div>
        <div class="input-group">
            <label>DSI Machine (Auto MA%)</label>
            <select id="mMachine" onchange="updateCalculations()">
                <option value="7">Golden Wheel D/N (7% MA)</option>
                <option value="5">Juki S/N Lock Stitch (5% MA)</option>
                <option value="5.5">Golden Wheel Binding (5.5% MA)</option>
                <option value="3">Seam Opening M/C (3% MA)</option>
                <option value="0">Manual Bench Work (0% MA)</option>
            </select>
        </div>
        <div class="input-group">
            <label>P&F Allowance %</label>
            <input type="number" id="mPnf" value="8" step="1" oninput="updateCalculations()">
        </div>
        <div class="input-group comments-group">
            <label>Comments (Operator, Material, Size, etc.)</label>
            <input type="text" id="mComments" placeholder="e.g., Erandi, Size 6, PVC Material, Study V005...">
        </div>
    </div>

    <!-- MAIN WORKSPACE -->
    <div class="workspace">
        
        <!-- LEFT: VIDEO -->
        <div class="video-section">
            <div class="video-container">
                <video id="liveCam" autoplay muted playsinline></video>
                <video id="improvedVid" controls loop muted playsinline style="display:none;"></video>
                
                <div class="ai-overlay" id="aiOverlay"></div>
                <div class="ai-hud" id="aiHud"><div class="red-dot"></div> AI Motion Tracking Active</div>
                <div class="ai-element-popup" id="elementPopup">Detecting...</div>
            </div>
            
            <div class="video-controls">
                <button class="btn-action btn-start" id="btnStart" onclick="startAiStudy()">🔴 Start Auto-Study</button>
                <button class="btn-action btn-stop" id="btnStop" onclick="stopAiStudy()">⏹️ Stop & Finalize SMV</button>
                <button class="btn-action btn-improve" id="btnImprove" onclick="generateImprovedVideo()">✨ Generate Improved Video (Trim Muda)</button>
            </div>
        </div>

        <!-- RIGHT: LIVE DATA -->
        <div class="data-section">
            <div class="kpi-grid">
                <div class="kpi-box">
                    <h4>Current Cycle (Sec)</h4>
                    <div class="val" id="kpiCycle" style="color:#fcd34d;">0.00</div>
                </div>
                <div class="kpi-box">
                    <h4>AI Perf. Rating</h4>
                    <div class="val" id="kpiRating" style="color:#c084fc;">--%</div>
                </div>
                <div class="kpi-box">
                    <h4>Current SMV / Prs</h4>
                    <div class="val" id="kpiSmv">--</div>
                </div>
                <div class="kpi-box highlight">
                    <h4>Kaizen Target / Hr</h4>
                    <div class="val" id="kpiTarget">--</div>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th width="15%">Element</th>
                            <th width="45%">Detected Motion</th>
                            <th width="20%">Base (s)</th>
                            <th width="20%">Status</th>
                        </tr>
                    </thead>
                    <tbody id="elementsTableBody">
                        <tr><td colspan="4" style="text-align:center; padding: 20px; color:#64748b;">Hit 'Start Auto-Study' to begin AI tracking.</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="bottom-actions">
                <button class="btn-pdf" onclick="printOfficialPDF()">🖨️ Export PDF Sheet</button>
                <button class="btn-audit" onclick="runAiAudit()">🤖 AI Method Audit</button>
            </div>
        </div>

    </div>

    <!-- PDF PRINT AREA -->
    <div id="printArea"></div>

<script>
    let camStream = null;
    let mediaRecorder = null;
    let recordedChunks = [];
    let isStudying = false;
    let autoInterval = null;
    let cycleStartTime = 0;
    
    // AI Simulation Data
    let elementLabels = ["Ⓐ Pick up & Align", "Ⓑ Main Sewing/Process", "Ⓒ Dispose / Bundle"];
    let currentElemIdx = 0;
    let recordedElements = []; // Store finalized times
    let currentRating = 88;

    async function startCamera() {
        const vid = document.getElementById("liveCam");
        const imp = document.getElementById("improvedVid");
        vid.style.display = "block";
        imp.style.display = "none";
        
        try {
            if (camStream) camStream.getTracks().forEach(t => t.stop());
            camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
            vid.srcObject = camStream;
            document.getElementById("btnImprove").style.display = "none";
            document.getElementById("btnStart").style.display = "block";
        } catch (e) {
            alert("Camera blocked or unavailable. Falling back to simulation mode.");
        }
    }

    function startAiStudy() {
        if (isStudying) return;
        isStudying = true;
        recordedElements = [];
        currentElemIdx = 0;
        
        document.getElementById("btnStart").style.display = "none";
        document.getElementById("btnStop").style.display = "block";
        document.getElementById("btnImprove").style.display = "none";
        
        document.getElementById("aiOverlay").classList.add("active");
        document.getElementById("aiHud").classList.add("recording");
        
        const tbody = document.getElementById("elementsTableBody");
        tbody.innerHTML = "";

        // Start Recording Video for the "Improved Video" generator
        const vid = document.getElementById("liveCam");
        if (vid.srcObject) {
            recordedChunks = [];
            mediaRecorder = new MediaRecorder(vid.srcObject, { mimeType: 'video/webm' });
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
            mediaRecorder.start();
        }

        // Trigger AI Simulation Loop
        cycleStartTime = performance.now();
        triggerNextAiElement();
        
        // Live Clock
        autoInterval = setInterval(() => {
            const currentSec = (performance.now() - cycleStartTime) / 1000;
            document.getElementById("kpiCycle").innerText = currentSec.toFixed(2);
            document.getElementById("kpiRating").innerText = currentRating + "%";
        }, 100);
    }

    function triggerNextAiElement() {
        if (!isStudying) return;
        
        const elemName = elementLabels[currentElemIdx];
        const popup = document.getElementById("elementPopup");
        popup.innerHTML = `👁️ Tracking: ${elemName}`;
        popup.style.display = "block";

        // Add active row to table
        const tbody = document.getElementById("elementsTableBody");
        const rowId = `row-${currentElemIdx}`;
        tbody.innerHTML += `
            <tr id="${rowId}" class="active-row">
                <td style="font-weight:bold; color:#38bdf8;">Elem ${String.fromCharCode(65 + currentElemIdx)}</td>
                <td>${elemName}</td>
                <td id="time-${currentElemIdx}">...</td>
                <td><span style="color:#fcd34d;">Scanning</span></td>
            </tr>
        `;

        // Simulate AI determining when element finishes (Random realistic time)
        // Pick up: 1.5s - 2.5s | Sewing: 5.0s - 8.0s | Dispose: 1.0s - 2.0s
        let durationMs = 2000; 
        if (currentElemIdx === 0) durationMs = 1500 + Math.random() * 1000;
        if (currentElemIdx === 1) durationMs = 5000 + Math.random() * 3000;
        if (currentElemIdx === 2) durationMs = 1000 + Math.random() * 1000;

        setTimeout(() => {
            if (!isStudying) return;
            
            // Finalize Element
            const finalSec = durationMs / 1000;
            recordedElements.push({ name: elemName, timeSec: finalSec });
            
            document.getElementById(`time-${currentElemIdx}`).innerText = finalSec.toFixed(2);
            document.getElementById(rowId).classList.remove("active-row");
            document.getElementById(rowId).cells[3].innerHTML = `<span style="color:#22c55e;">✅ Done</span>`;
            
            currentElemIdx++;
            cycleStartTime = performance.now(); // reset clock for next element

            if (currentElemIdx < elementLabels.length) {
                triggerNextAiElement();
            } else {
                // Restart cycle automatically
                currentElemIdx = 0;
                triggerNextAiElement();
                updateCalculations(); // Update final SMV based on moving average
            }
        }, durationMs);
    }

    function stopAiStudy() {
        if (!isStudying) return;
        isStudying = false;
        clearInterval(autoInterval);
        
        document.getElementById("btnStop").style.display = "none";
        document.getElementById("btnImprove").style.display = "block";
        
        document.getElementById("aiOverlay").classList.remove("active");
        document.getElementById("aiHud").classList.remove("recording");
        document.getElementById("elementPopup").style.display = "none";

        if (mediaRecorder && mediaRecorder.state !== "inactive") {
            mediaRecorder.stop();
        }

        updateCalculations();
    }

    function updateCalculations() {
        if (recordedElements.length === 0) return;

        // Group by element to find averages
        let sums = [0, 0, 0];
        let counts = [0, 0, 0];
        recordedElements.forEach((el, i) => {
            const type = i % 3; // 0=Pick, 1=Sew, 2=Dispose
            sums[type] += el.timeSec;
            counts[type]++;
        });

        const avgSecs = sums.map((sum, i) => counts[i] > 0 ? sum / counts[i] : 0);
        const avgMins = avgSecs.map(s => s / 60);

        // Allowances
        const maPct = parseFloat(document.getElementById("mMachine").value) || 0;
        const pnfPct = parseFloat(document.getElementById("mPnf").value) || 8;
        const targetRsmv = parseFloat(document.getElementById("mTargetRSmv").value) || 0.450;

        // Base times (Apply Rating)
        const baseMins = avgMins.map(m => m * (currentRating / 100));
        
        // Element B gets Machine Allowance
        const bBaseWithMa = baseMins[1] * (1 + maPct / 100);
        
        // Total Base = A(Base) + B(Base+MA) + C(Base)
        const totalBase = baseMins[0] + bBaseWithMa + baseMins[2];
        
        // Final SMV = Total Base * (1 + P&F)
        const finalSmv = totalBase * (1 + pnfPct / 100);
        const targetHr = finalSmv > 0 ? Math.round(60 / finalSmv) : 0;
        const impTargetHr = targetRsmv > 0 ? Math.round(60 / targetRsmv) : 0;

        // Update UI
        document.getElementById("kpiSmv").innerText = finalSmv.toFixed(3);
        document.getElementById("kpiTarget").innerText = targetHr + " / hr";
        document.getElementById("hudSmv").innerText = finalSmv.toFixed(3);
        document.getElementById("hudTargetHr").innerText = targetHr + "/hr";
        document.getElementById("hudImpSmv").innerText = targetRsmv.toFixed(3) + ` (${impTargetHr}/hr)`;

        // Save globally for printing
        window.finalStudyData = {
            op: document.getElementById("mOperation").value,
            style: document.getElementById("mProduct").value,
            ma: maPct, pnf: pnfPct, smv: finalSmv, target: targetHr,
            avgs: avgMins, base: baseMins, comments: document.getElementById("mComments").value
        };
    }

    function generateImprovedVideo() {
        if (recordedChunks.length === 0) {
            alert("No video recorded during study.");
            return;
        }

        const vid = document.getElementById("liveCam");
        const impV = document.getElementById("improvedVid");
        
        vid.style.display = "none";
        impV.style.display = "block";
        document.getElementById("elementPopup").style.display = "block";
        document.getElementById("elementPopup").innerHTML = `✨ MUDA TRIMMED. Playing at Target R.SMV Pace.`;
        document.getElementById("elementPopup").style.borderColor = "#10b981";

        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        impV.src = URL.createObjectURL(blob);
        
        // Speed up video to simulate 100% efficient kaizen target
        const currentSmv = window.finalStudyData ? window.finalStudyData.smv : 0.6;
        const targetRsmv = parseFloat(document.getElementById("mTargetRSmv").value) || 0.45;
        const boost = Math.min(1.5, Math.max(1.1, currentSmv / targetRsmv));
        
        impV.playbackRate = boost;
        impV.play();
    }

    function printOfficialPDF() {
        if (!window.finalStudyData) return alert("Please complete a study first.");
        const d = window.finalStudyData;
        
        const printDiv = document.getElementById("printArea");
        printDiv.innerHTML = `
            <div style="border: 2px solid #000; padding: 20px; font-family: Arial, sans-serif; color: #000; background: #fff;">
                <h2 style="text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px;">DSI TIME AND MOTION ANALYSIS</h2>
                
                <table style="width: 100%; margin-bottom: 20px; text-align: left; font-size: 14px;">
                    <tr>
                        <td><strong>Operation:</strong> ${d.op}</td>
                        <td><strong>Product/Style:</strong> ${d.style}</td>
                    </tr>
                    <tr>
                        <td><strong>Date:</strong> ${new Date().toLocaleDateString()}</td>
                        <td><strong>Machine MA%:</strong> ${d.ma}%</td>
                    </tr>
                    <tr>
                        <td colspan="2"><strong>Comments:</strong> ${d.comments}</td>
                    </tr>
                </table>

                <table style="width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 14px;">
                    <thead>
                        <tr style="background: #eee;">
                            <th style="border: 1px solid #000; padding: 8px;">Element</th>
                            <th style="border: 1px solid #000; padding: 8px;">Avg Time (min)</th>
                            <th style="border: 1px solid #000; padding: 8px;">Rating</th>
                            <th style="border: 1px solid #000; padding: 8px;">Basic Time (min)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td style="border: 1px solid #000; padding: 8px;">A (Pick/Align)</td>
                            <td style="border: 1px solid #000; padding: 8px;">${d.avgs[0].toFixed(4)}</td>
                            <td style="border: 1px solid #000; padding: 8px;">${currentRating}%</td>
                            <td style="border: 1px solid #000; padding: 8px;">${d.base[0].toFixed(4)}</td>
                        </tr>
                        <tr>
                            <td style="border: 1px solid #000; padding: 8px;">B (Main Machine)</td>
                            <td style="border: 1px solid #000; padding: 8px;">${d.avgs[1].toFixed(4)}</td>
                            <td style="border: 1px solid #000; padding: 8px;">${currentRating}%</td>
                            <td style="border: 1px solid #000; padding: 8px;">${d.base[1].toFixed(4)} <span style="font-size:10px;">(+${d.ma}% MA)</span></td>
                        </tr>
                        <tr>
                            <td style="border: 1px solid #000; padding: 8px;">C (Dispose)</td>
                            <td style="border: 1px solid #000; padding: 8px;">${d.avgs[2].toFixed(4)}</td>
                            <td style="border: 1px solid #000; padding: 8px;">${currentRating}%</td>
                            <td style="border: 1px solid #000; padding: 8px;">${d.base[2].toFixed(4)}</td>
                        </tr>
                    </tbody>
                </table>

                <div style="background: #f8f9fa; border: 1px solid #000; padding: 15px; border-radius: 5px;">
                    <h3>Standard Time Calculation</h3>
                    <p><strong>Total Base Time (inc. MA):</strong> ${(d.smv / (1 + d.pnf/100)).toFixed(4)} min</p>
                    <p><strong>P&F Allowance:</strong> ${d.pnf}%</p>
                    <h2 style="color: #d32f2f; margin-top: 10px;">FINAL SMV: ${d.smv.toFixed(3)} min/pair</h2>
                    <h3 style="color: #1976d2;">Target Production: ${d.target} pairs/hr</h3>
                </div>
            </div>
        `;
        window.print();
    }

    function runAiAudit() {
        if (!window.finalStudyData) return alert("Complete a study first.");
        alert("🤖 AI Audit: Operator exhibits high reach distance on Element C (Dispose). Suggest installing gravity drop chute to save 1.2s per cycle.");
    }
</script>
</body>
</html>
